const ic=(n,s=14,o=1)=>`<i class="ic" style="width:${s}px;height:${s}px;opacity:${o}">${I[n]}</i>`;
// ---------------- model (as in the sizing workbook) ----------------
const DUR=[5,10,15,20,30,45,60,90,120,180,240,300,360,720,1440];
const IDF0={5:[97.41,76.98,63.34,53.54,41.68,31.78,25.35,18.66,15.11,10.81,8.62,7.21,6.22,3.68,1.93],10:[118,97.61,80.41,68.58,54.72,42.82,34.22,25.18,20.57,14.6,11.61,9.73,8.44,5.13,2.71],25:[133.66,120.18,99.22,85.92,71.32,58.03,46.52,34.2,28.31,19.84,15.72,13.2,11.58,7.31,3.9],50:[169.22,152.15,125.61,108.78,90.3,73.47,58.89,43.29,35.85,25.12,19.91,16.71,14.65,9.25,4.94],100:[209.2,188.11,155.29,134.49,111.63,90.83,72.81,53.52,44.32,31.06,24.61,20.66,18.12,11.44,6.1]};
const HOT0=[{id:'H1',d:'Underpass · arterial junction',A:12,C:0.75,tc:20,Qcap:1.8,pond:0,r:[3,3,1,3,3],x:520,y:275},{id:'H2',d:'Residential low point',A:35,C:0.45,tc:45,Qcap:2.6,pond:4500,r:[3,2,3,0,1],x:230,y:232},{id:'H3',d:'Downtown near coastline',A:22,C:0.85,tc:25,Qcap:3.1,pond:8000,r:[1,1,0,1,3],x:680,y:142},{id:'H4',d:'New residential district',A:60,C:0.35,tc:60,Qcap:3.4,pond:0,r:[1,0,1,0,0],x:420,y:470},{id:'H5',d:'Airport culvert catchment',A:40,C:0.6,tc:30,Qcap:4.0,pond:6000,r:[2,1,1,3,2],x:900,y:340},{id:'H6',d:'Government precinct',A:8,C:0.8,tc:15,Qcap:1.2,pond:2000,r:[2,2,2,3,2],x:700,y:292}];
const deep=o=>JSON.parse(JSON.stringify(o));
let INPUTS={v:'2.1',ts:'19 / 09 / 2026 09:10',IDF:deep(IDF0),CF:{5:1,10:1,25:1.1,50:1.2,100:1.25},ASM:{sed:1.05,shape:0.5,draw:2,pump:300,tank:15},HOT:deep(HOT0)};
let DRAFT=null; const HISTORY=[{v:'2.0',ts:'12 / 09 / 2026 14:20',who:'Engineer',what:'Initial hotspot register (6 sites) · DM IDF reference · assumptions'},{v:'2.1',ts:'19 / 09 / 2026 09:10',who:'Engineer',what:'H5 pond 6,000 m³ added · drawdown set to 2 h (client SLA)'}];
const state={role:'operator',rp:100,custom:{P:100,D:120},over:{draw:null,pump:null,tank:null},showHot:false,ran:false,computing:false,panel:true,drawer:false,tab:'hot',sel:null,ann:false,msgs:[]};
function ASM(){ const a={...INPUTS.ASM}; for(const k of ['draw','pump','tank']) if(state.over[k]!=null) a[k]=state.over[k]; return a; }
function overCount(){ return ['draw','pump','tank'].filter(k=>state.over[k]!=null&&state.over[k]!==INPUTS.ASM[k]).length; }
const bucket=tc=>{let b=DUR[0];for(const d of DUR){if(d<=tc)b=d;}return b;};
function calc(h,rp,inp=INPUTS){ const b=bucket(h.tc); let I; if(rp==='custom'){const P=state.custom.P,D=state.custom.D; I=P/Math.max(b,D)*60;} else I=inp.IDF[rp][DUR.indexOf(b)]; const cf=rp==='custom'?1:(inp.CF[rp]??1); const Cadj=Math.min(h.C*cf,1); const Q=Cadj*I*h.A/360; const ex=Math.max(0,Q-h.Qcap); const A=ASM(); const vol=ex*b*60*A.shape; const req=vol*A.sed; const short=Math.max(0,req-h.pond); const rate=A.draw>0?short/A.draw:0; const pumps=rate>0?Math.ceil(rate/A.pump):0; const loads=short>0?Math.ceil(short/A.tank):0; return {b,I,cf,Cadj,Q,ex,vol,req,short,rate,pumps,loads}; }
function results(){ const rows=INPUTS.HOT.map(h=>({h,c:calc(h,state.rp)})); const s=rows.reduce((a,x)=>{a.Q+=x.c.Q;a.ex+=x.c.ex;a.req+=x.c.req;a.avail+=x.h.pond;a.short+=x.c.short;a.pumps+=x.c.pumps;a.loads+=x.c.loads;a.l1+=Math.min(x.c.Q,x.h.Qcap);a.l2+=x.c.ex*(x.c.req>0?Math.min(1,x.h.pond/x.c.req):0);a.l3+=x.c.ex*(x.c.req>0?1-Math.min(1,x.h.pond/x.c.req):0);return a;},{Q:0,ex:0,req:0,avail:0,short:0,pumps:0,loads:0,l1:0,l2:0,l3:0}); return {rows,s}; }
const fmt=(n,d=0)=>n.toLocaleString('en-GB',{maximumFractionDigits:d,minimumFractionDigits:d});
const rpLabel=rp=>rp==='custom'?`${state.custom.P} mm / ${state.custom.D} min`:`1-in-${rp}`;
// ---------------- views ----------------
function basemap(){ const CATCH=['120,180 300,90 400,180 280,300 160,300 100,320','300,90 560,60 600,170 400,180','560,60 820,110 760,230 600,170','400,180 600,170 640,330 430,340 280,300','600,170 760,230 820,380 640,330','820,110 1000,220 1040,360 900,520 820,380 760,230','100,320 160,300 280,300 430,340 640,330 820,380 900,520 640,580 380,560 180,470']; let s='<svg viewBox="0 0 1100 620" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%"><rect width="1100" height="620" fill="#0f1216"/><polygon points="120,180 300,90 560,60 820,110 1000,220 1040,360 900,520 640,580 380,560 180,470 100,320" fill="#22262b" stroke="#3a3f46" stroke-width="1.5"/>'; CATCH.forEach(p=>s+=`<polygon points="${p}" fill="none" stroke="#3a3f46" stroke-width="1" stroke-dasharray="3 4"/>`); [[[150,410],[215,215]],[[300,92],[465,125]],[[465,125],[685,140]],[[215,215],[500,255]],[[500,255],[705,275]],[[705,275],[900,300]],[[500,255],[500,470]],[[500,470],[760,470]],[[760,470],[900,520]],[[280,300],[430,340]],[[640,330],[820,380]]].forEach(([a,b])=>s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#4a5058" stroke-width="2" opacity=".7"/>`); return s+'<text x="16" y="600" fill="#5b6470" font-size="12">Basemap · 3D placeholder · schematic, not to scale</text></svg>'; }
function pins(res){ return INPUTS.HOT.map(h=>{ const c=res?res.rows.find(x=>x.h.id===h.id).c:null; let col='rgba(255,255,255,.35)',txt='not computed'; if(c){ if(c.ex===0){col='#4786C9';txt='network holds · Line 1';} else if(c.short===0){col='#66C56B';txt='pond holds · Line 2';} else {col='#E0574E';txt=`${c.pumps} pumps · ${fmt(c.short)} m³ short · Line 3`;} } return `<div class="pin ${state.sel===h.id?'sel':''}" data-id="${h.id}" style="left:${h.x/1100*100}%;top:${h.y/620*100}%"><div class="dot" style="background:${col}"></div><div class="chip" style="border-color:${col}99"><b>${h.id} · ${h.d}</b><span>${txt}</span></div></div>`; }).join(''); }
function menu(){ return `<div class="menu"><div class="logo">LX</div><div class="t">Urban Flood Readiness</div><div class="nav"><span>Master Plan Review</span><span>Liveability Profile</span><b>Command Centre</b><span>ADREC</span></div><div class="right"><span class="note">Role</span><div class="seg" id="role"><span class="${state.role==='operator'?'on':''}" data-r="operator">Operator · client</span><span class="${state.role==='engineer'?'on':''}" data-r="engineer">Engineer · back-end</span></div><div class="seg"><span class="${state.ann?'on':''}" id="annt">${ic('info',14)} Notes</span></div><span>dd / mm / yyyy · 24h</span></div></div>`; }
function kpis(res){ const s=res?res.s:null; return `<div class="kpi"><div class="k"><div><div class="h">Storm</div><div class="l">${rpLabel(state.rp)}${state.rp==='custom'?' · Cf 1.0':' · Cf '+(INPUTS.CF[state.rp]??1)}</div></div><div><div class="v">${INPUTS.HOT.length}</div><div class="u">hotspots</div></div></div>

    if(worst.length) {
        aiText += `<div style="margin-bottom:12px; font-size:12px; line-height: 1.5;">
            <span style="color:#E0574E; font-weight:700;">⚠️ Line 3 (Emergency Fleet) Required:</span><br>
            Capacity shortfall at ${worst.length} locations. Total deficit: <b>${fmt(r.s.short)} m³</b>.
        </div>`;
        
        aiText += `<div style="font-size:12px; margin-bottom:10px; display:flex; align-items:center; gap:6px;">
            <span style="font-size:14px;">📍</span> <b>High-Risk Hotspots & Dispatch Directives:</b>
        </div>`;
        
        worst.forEach(x => {
            aiText += `<div style="margin-bottom:8px; background:rgba(224,87,78,.1); border:1px solid rgba(224,87,78,.2); padding:10px 12px; border-radius:6px; border-left:3px solid #E0574E;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                    <b>${x.h.id} <span style="color:rgba(255,255,255,.6); font-weight:normal;">· ${x.h.d}</span></b>
                    <span class="tag d" style="font-size:10px;">${fmt(x.c.short)} m³ Deficit</span>
                </div>
                
                <div style="display:flex; gap:12px; margin-bottom:10px; font-size:11px;">
                    <div style="flex:1; background:rgba(255,255,255,.05); padding:6px; border-radius:4px; text-align:center;">
                        <div style="color:rgba(255,255,255,.55); margin-bottom:2px;">Available Pond</div>
                        <b style="font-size:13px;">${fmt(x.h.pond)} m³</b>
                    </div>
                    <div style="flex:1; background:rgba(255,255,255,.05); padding:6px; border-radius:4px; text-align:center;">
                        <div style="color:rgba(255,255,255,.55); margin-bottom:2px;">Required Volume</div>
                        <b style="font-size:13px;">${fmt(x.c.req)} m³</b>
                    </div>
                </div>

                <div style="color:rgba(255,255,255,.85); line-height:1.4;">
                    <span style="color:#E0A44E;">⚡ <b>ACTION:</b></span> Dispatch <b style="color:#fff;">${x.c.pumps} mobile pumps</b> or <b style="color:#fff;">${x.c.loads} water tanks</b>. Drain excess via HDPE over-ground pipes within ${ASM().draw} hours.
                </div>
            </div>`;
        });
    } else {
         aiText += `<div style="margin-bottom:12px; color:#66C56B;">
            ✅ <b>Line 3 (Emergency Fleet):</b> All locations secured by Lines 1 & 2. No deployment required.
         </div>`;
    }
    
    aiText += `<div style="margin-top:16px; font-size:10px; color:rgba(255,255,255,.4); border-top:1px solid rgba(255,255,255,.1); padding-top:8px;">
        Recommendations generated by platform model · Duty commander must verify before execution.
    </div>`;
    
    state.msgs.push({kind:'ai',t:aiText}); render(); 
  },700); 
}
function bind(){
 document.querySelectorAll('#role span').forEach(e=>e.onclick=()=>{state.role=e.dataset.r; if(state.role!=='engineer') state.drawer=false; render();});
 const an=document.getElementById('annt'); if(an) an.onclick=()=>{state.ann=!state.ann;render();};
 document.querySelectorAll('[data-rp]').forEach(e=>e.onclick=()=>{state.rp=e.dataset.rp==='custom'?'custom':+e.dataset.rp; state.sel=null; render();});
 const cP=document.getElementById('cP'),cD=document.getElementById('cD'); if(cP){cP.onchange=()=>{state.custom.P=+cP.value;}; cD.onchange=()=>{state.custom.D=+cD.value;};}
 const r=document.getElementById('run'); if(r) r.onclick=run;
 document.querySelectorAll('input[data-ov]').forEach(i=>i.onchange=()=>{state.over[i.dataset.ov]=+i.value; render();});
 document.querySelectorAll('[data-reset]').forEach(e=>e.onclick=()=>{state.over[e.dataset.reset]=null; render();});
 const th=document.getElementById('togHot'); if(th) th.onclick=()=>{state.showHot=!state.showHot;render();};
 const cl=document.getElementById('closep'); if(cl) cl.onclick=()=>{state.panel=false;render();};
 const tg=document.getElementById('tgl'); if(tg) tg.onclick=()=>{state.panel=!state.panel;render();};
 document.querySelectorAll('.pin, .row[data-id]').forEach(e=>e.onclick=()=>{ if(!state.ran) return; state.sel=state.sel===e.dataset.id?null:e.dataset.id; state.panel=true; state.showHot=true; render(); });
 const ex=document.getElementById('exp'); if(ex) ex.onclick=()=>{ if(!state.ran) return; const res=results(); let out='hotspot,rp,duration_min,I_mmh,Q_m3s,Qcap,excess,required_pond,available_pond,shortfall,pumps,tanker_loads,inputs_version\n'; res.rows.forEach(x=>out+=[x.h.id,rpLabel(state.rp),x.c.b,x.c.I.toFixed(1),x.c.Q.toFixed(3),x.h.Qcap,x.c.ex.toFixed(3),x.c.req.toFixed(0),x.h.pond,x.c.short.toFixed(0),x.c.pumps,x.c.loads,'v'+INPUTS.v].join(',')+'\n'); const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(out); a.download='scenario_result.csv'; a.click(); toast('Exported scenario_result.csv · inputs v'+INPUTS.v+(overCount()?' + '+overCount()+' override(s)':'')); };
 const inp=document.getElementById('inputs'); if(inp) inp.onclick=()=>{DRAFT=deep({IDF:INPUTS.IDF,CF:INPUTS.CF,ASM:INPUTS.ASM,HOT:INPUTS.HOT}); state.drawer=true; state.tab='hot'; render();};
 document.querySelectorAll('.tabs2 span').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;render();});
 document.querySelectorAll('.sheet input[data-h]').forEach(i=>i.onchange=()=>{const h=DRAFT.HOT[+i.dataset.h]; const f=i.dataset.f; h[f]=f==='d'?i.value:+i.value; render();});
 document.querySelectorAll('.sheet input[data-rp][data-j]').forEach(i=>i.onchange=()=>{DRAFT.IDF[i.dataset.rp][+i.dataset.j]=+i.value;});
 document.querySelectorAll('.sheet input[data-a]').forEach(i=>i.onchange=()=>{DRAFT.ASM[i.dataset.a]=+i.value;});
 document.querySelectorAll('.sheet input[data-cf]').forEach(i=>i.onchange=()=>{DRAFT.CF[i.dataset.cf]=+i.value;});
 const cancel=document.getElementById('cancel'); if(cancel) cancel.onclick=()=>{DRAFT=null;state.drawer=false;render();toast('Draft discarded · inputs remain v'+INPUTS.v);};
 const save=document.getElementById('save'); if(save) save.onclick=()=>{ const changed=[]; ['sed','shape','draw','pump','tank'].forEach(k=>{if(DRAFT.ASM[k]!==INPUTS.ASM[k]) changed.push(k+' '+INPUTS.ASM[k]+' → '+DRAFT.ASM[k]);}); DRAFT.HOT.forEach((h,i)=>{const o=INPUTS.HOT[i]; ['A','C','tc','Qcap','pond','d'].forEach(f=>{if(h[f]!==o[f]) changed.push(h.id+' '+f+' '+o[f]+' → '+h[f]);});}); if(JSON.stringify(DRAFT.IDF)!==JSON.stringify(INPUTS.IDF)) changed.push('IDF table edited'); if(JSON.stringify(DRAFT.CF)!==JSON.stringify(INPUTS.CF)) changed.push('Cf edited'); const v=nextV(); INPUTS={v,ts:new Date().toLocaleString('en-GB',{hour12:false}).replace(',',''),IDF:DRAFT.IDF,CF:DRAFT.CF,ASM:DRAFT.ASM,HOT:DRAFT.HOT}; HISTORY.push({v,ts:INPUTS.ts,who:'Engineer',what:changed.length?changed.join(' · '):'No field changes (re-saved)'}); DRAFT=null; state.drawer=false; toast(`Saved inputs v${v} · ${changed.length} change(s)${state.ran?' · scenario re-run':''}`); if(state.ran) run(); else render(); };
 document.querySelectorAll('[data-restore]').forEach(e=>e.onclick=()=>{toast('Restore creates a new version from v'+e.dataset.restore+' (demo: no snapshot stored)');});
 document.querySelectorAll('[data-cmp]').forEach(e=>e.onclick=()=>{state.rp=+e.dataset.cmp;state.sel=null;run();});
 const pl=document.getElementById('plan'); if(pl) pl.onclick=()=>toast('Hand-over to Readiness Plan · Level 2 · pumps per hotspot pre-filled from this run (module outside this design file)');
}
function fit(){ const s=Math.min(1,(window.innerWidth-0)/1920); const w=document.getElementById('wrap'); w.style.transform=`scale(${s})`; document.body.style.height=(1080*s)+'px'; }
window.onresize=fit; render();
</script>
</body>
</html>
