# 一体化容器里的唯一对外入口（8080）：静态前端 + /api 反代到本机 uvicorn(127.0.0.1:8101)。
# 前端是 history 路由（/calculator、/simulations/...），所以未知路径回落到 index.html。
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/flood-web;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;          # 全域批算、溢水点首次现算可能要十几秒到几分钟
        proxy_send_timeout 600s;
    }

    # 容器健康检查：穿过 nginx 到 API 的 `/`（不连数据库）
    location = /healthz {
        proxy_pass http://127.0.0.1:8101/;
        access_log off;
    }

    # Swagger / OpenAPI（排查接口用）
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
    }

    location /assets/ {                    # Vite 产物带哈希，可长缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
